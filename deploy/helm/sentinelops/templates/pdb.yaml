{{- if .Values.podDisruptionBudget.enabled }}
{{- range $name := list "api" "worker" "web" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sentinelops.fullname" $ }}-{{ $name }}
spec:
  maxUnavailable: {{ $.Values.podDisruptionBudget.maxUnavailable }}
  selector: { matchLabels: { app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }} } }
{{- end }}
{{- if .Values.gateway.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sentinelops.fullname" . }}-gateway
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway } }
{{- end }}
{{- end }}
