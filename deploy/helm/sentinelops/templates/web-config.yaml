apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentinelops.fullname" . }}-web-config
  labels: {{- include "sentinelops.labels" . | nindent 4 }}
data:
  config.js: |
    window.__SENTINEL_CONFIG__ = {
      authMode: 'oidc',
      oidcAuthority: {{ .Values.global.oidcIssuerURL | quote }},
      oidcClientId: {{ .Values.global.oidcClientID | quote }},
      oidcScope: 'openid profile email'
    };
