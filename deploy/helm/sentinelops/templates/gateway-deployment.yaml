{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinelops.fullname" . }}-gateway
  labels:
    {{- include "sentinelops.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  revisionHistoryLimit: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sentinelops, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/gateway-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "sentinelops.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway } }
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway }
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}{{ ternary (printf "@%s" .Values.gateway.image.digest) (printf ":%s" .Values.gateway.image.tag) (ne (default "" .Values.gateway.image.digest) "") }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          args: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          env:
            - name: MTLS_PROXY_SHARED_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.global.existingSecret }}, key: {{ .Values.global.mtlsProxySecretKey }} } }
          ports:
            - { name: https, containerPort: 8443, protocol: TCP }
            - { name: otlp-grpc, containerPort: 4317, protocol: TCP }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          startupProbe: { tcpSocket: { port: https }, periodSeconds: 5, failureThreshold: 30 }
          readinessProbe: { tcpSocket: { port: https }, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
          livenessProbe: { tcpSocket: { port: https }, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3 }
          volumeMounts:
            - { name: config, mountPath: /etc/caddy/Caddyfile, subPath: Caddyfile, readOnly: true }
            - { name: server-tls, mountPath: /certs/server, readOnly: true }
            - { name: client-ca, mountPath: /certs/client-ca, readOnly: true }
            {{- if .Values.global.upstreamCABundleSecretName }}
            - { name: upstream-ca, mountPath: /certs/upstream-ca, readOnly: true }
            {{- end }}
            - { name: data, mountPath: /data }
            - { name: runtime-config, mountPath: /config }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: {{ include "sentinelops.fullname" . }}-gateway } }
        - { name: server-tls, secret: { secretName: {{ .Values.gateway.serverTLSSecretName }}, defaultMode: 288 } }
        - { name: client-ca, secret: { secretName: {{ .Values.gateway.clientCASecretName }}, defaultMode: 288 } }
        {{- if .Values.global.upstreamCABundleSecretName }}
        - { name: upstream-ca, secret: { secretName: {{ .Values.global.upstreamCABundleSecretName }}, defaultMode: 288 } }
        {{- end }}
        - { name: data, emptyDir: { sizeLimit: 64Mi } }
        - { name: runtime-config, emptyDir: { sizeLimit: 64Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
      imagePullSecrets: {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
{{- end }}
