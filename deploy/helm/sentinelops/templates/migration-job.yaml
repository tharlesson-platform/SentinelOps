{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sentinelops.fullname" . }}-migrate
  labels:
    {{- include "sentinelops.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "0"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinelops
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "sentinelops.fullname" . }}-migrate
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: "{{ .Values.migration.image.repository }}{{ ternary (printf "@%s" .Values.migration.image.digest) (printf ":%s" .Values.migration.image.tag) (ne (default "" .Values.migration.image.digest) "") }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          env:
            - name: DATABASE_MIGRATION_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.global.existingSecret }}, key: {{ .Values.global.migrationDatabaseURLKey }} } }
            {{- if .Values.global.upstreamCABundleSecretName }}
            - { name: SSL_CERT_FILE, value: /etc/sentinelops/upstream-ca/{{ .Values.global.upstreamCABundleKey }} }
            {{- end }}
          resources: {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.global.upstreamCABundleSecretName }}
            - { name: upstream-ca, mountPath: /etc/sentinelops/upstream-ca, readOnly: true }
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
        {{- if .Values.global.upstreamCABundleSecretName }}
        - { name: upstream-ca, secret: { secretName: {{ .Values.global.upstreamCABundleSecretName }}, defaultMode: 288 } }
        {{- end }}
      imagePullSecrets: {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
{{- end }}
