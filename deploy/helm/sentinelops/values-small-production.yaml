global: { requireImageDigests: true }
topologySpread: { whenUnsatisfiable: DoNotSchedule }
api: { replicas: 2, autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 5, targetCPUUtilizationPercentage: 70 } }
worker: { replicas: 2 }
web: { replicas: 2 }
agent: { enabled: false, replicas: 1 }
gateway: { enabled: true, replicas: 2, service: { type: LoadBalancer } }
