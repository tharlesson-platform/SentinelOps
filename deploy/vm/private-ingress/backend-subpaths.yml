services:
  grafana:
    environment:
      GF_SERVER_ROOT_URL: https://sentinelops.tqi.com.br/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_SERVER_COOKIE_SECURE: "true"
  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
      - --web.external-url=https://sentinelops.tqi.com.br/prometheus/
      - --web.route-prefix=/
  temporal-ui:
    environment:
      TEMPORAL_UI_PUBLIC_PATH: /temporal
      TEMPORAL_CORS_ORIGINS: https://sentinelops.tqi.com.br
  keycloak:
    environment:
      KC_HOSTNAME: https://sentinelops.tqi.com.br/keycloak
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - /opt/sentinelops/private-ingress/keycloak-data:/opt/keycloak/data
