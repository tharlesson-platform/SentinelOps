user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  geo $internal_client {
    default 0;
    127.0.0.0/8 1;
    10.10.0.0/16 1;
    10.212.0.0/16 1;
    172.48.10.0/24 1;
  }
  proxy_http_version 1.1;
  proxy_set_header Host sentinelops.tqi.com.br;
  proxy_set_header X-Forwarded-Host sentinelops.tqi.com.br;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  client_max_body_size 10m;

  server {
    listen 10.10.1.20:80;
    server_name sentinelops.tqi.com.br;
    allow 10.10.0.0/16;
    allow 10.212.0.0/16;
    allow 172.48.10.0/24;
    deny all;
    if ($host != sentinelops.tqi.com.br) { return 421; }
    if ($internal_client = 0) { return 403; }
    location / { return 308 https://sentinelops.tqi.com.br$request_uri; }
  }
  server {
    listen 10.10.1.20:443 ssl;
    listen 127.0.0.1:19443 ssl;
    server_name sentinelops.tqi.com.br;
    ssl_certificate /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;
    allow 127.0.0.0/8;
    allow 10.10.0.0/16;
    allow 10.212.0.0/16;
    allow 172.48.10.0/24;
    deny all;
    if ($host != sentinelops.tqi.com.br) { return 421; }
    if ($internal_client = 0) { return 403; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;
    root /portal;
    location = / { try_files /index.html =404; }
    location = /ingress-healthz { access_log off; return 200 "ingress ready\n"; }
    location = /_grafana_auth {
      internal;
      proxy_pass http://127.0.0.1:3001/api/user;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Host sentinelops.tqi.com.br;
      proxy_set_header X-Forwarded-Proto https;
    }
    location @login { return 302 /grafana/login; }
    location = /sentinelops { return 308 /sentinelops/; }
    location /sentinelops/api/ {
      proxy_pass http://127.0.0.1:8080/api/;
    }
    location = /sentinelops/healthz { proxy_pass http://127.0.0.1:8080/healthz; }
    location /sentinelops/ {
      root /web;
      try_files $uri $uri/ /sentinelops/index.html;
    }
    location = /grafana { return 308 /grafana/; }
    location /grafana/ {
      proxy_pass http://127.0.0.1:3001/;
      proxy_cookie_path /grafana /;
      proxy_cookie_flags grafana_session secure httponly samesite=lax;
    }
    location = /prometheus { return 308 /prometheus/; }
    location /prometheus/ {
      auth_request /_grafana_auth;
      error_page 401 = @login;
      limit_except GET { deny all; }
      proxy_pass http://127.0.0.1:9090/;
    }
    location = /temporal { return 308 /temporal/; }
    location /temporal/ {
      auth_request /_grafana_auth;
      error_page 401 = @login;
      limit_except GET { deny all; }
      proxy_pass http://127.0.0.1:8088;
    }
    location = /keycloak { return 308 /keycloak/; }
    location /keycloak/ {
      proxy_pass http://127.0.0.1:8081;
    }
    # Cada API mantém a coleta original intocada e exige sessão Grafana.
    location = /loki { return 308 /loki/; }
    location = /loki/ { return 302 '/grafana/explore?schemaVersion=1&panes=%7B%22logs%22%3A%7B%22datasource%22%3A%22loki%22%7D%7D&orgId=1'; }
    location /loki/api/ {
      auth_request /_grafana_auth;
      limit_except GET { deny all; }
      proxy_pass http://127.0.0.1:3100;
    }
    location = /tempo { return 308 /tempo/; }
    location = /tempo/ { return 302 '/grafana/explore?schemaVersion=1&panes=%7B%22traces%22%3A%7B%22datasource%22%3A%22tempo%22%7D%7D&orgId=1'; }
    location /tempo/api/ {
      auth_request /_grafana_auth;
      limit_except GET { deny all; }
      proxy_pass http://127.0.0.1:3200/api/;
    }
    location = /pyroscope { return 308 /pyroscope/; }
    location = /pyroscope/ { return 302 '/grafana/explore?schemaVersion=1&panes=%7B%22profiles%22%3A%7B%22datasource%22%3A%22pyroscope%22%7D%7D&orgId=1'; }
    location /pyroscope/querier.v1.QuerierService/ {
      auth_request /_grafana_auth;
      proxy_pass http://127.0.0.1:4040/querier.v1.QuerierService/;
    }
    location / { return 404; }
  }
}
