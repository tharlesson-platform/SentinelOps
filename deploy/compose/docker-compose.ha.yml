services:
  api:
    ports: !reset []

  api-edge:
    image: ${SENTINEL_WEB_IMAGE:-sentinelops-web:0.1.0-local}
    volumes:
      - ./api-edge.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:8080:3000"
    networks: [control]
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/readyz"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
