global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: sentinel-api
    static_configs: [{ targets: ["api:8080"] }]
  - job_name: alloy
    static_configs: [{ targets: ["alloy:12345"] }]
  - job_name: sentinel-vmware
    static_configs: [{ targets: ["vmware-exporter:9472"] }]
  - job_name: sentinel-postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
