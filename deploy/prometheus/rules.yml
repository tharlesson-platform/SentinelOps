groups:
  - name: sentinelops-self-monitoring
    rules:
      - alert: SentinelAPIUnavailable
        expr: up{job="sentinel-api"} == 0
        for: 2m
        labels: { severity: critical, team: platform, service: sentinel-api }
        annotations:
          summary: SentinelOps API indisponível
          runbook_url: docs/runbooks/control-plane-unavailable.md
      - alert: SyntheticProbeFailing
        expr: probe_success{job="blackbox-demo"} == 0
        for: 2m
        labels: { severity: warning, team: platform, service: sentinel-demo-api }
        annotations:
          summary: Probe sintético falhando
          runbook_url: docs/runbooks/synthetic-tests-failing.md
      - record: service:http_requests:rate5m
        expr: sum by (service) (rate(demo_pipeline_requests_total[5m]))

  - name: sentinelops-linux-hosts
    rules:
      - alert: LinuxHostDown
        expr: up{job="linux-node"} == 0
        for: 5m
        labels: { severity: critical, team: platform }
        annotations:
          summary: Host Linux sem coleta há 5 minutos
          runbook_url: docs/runbooks/operational-response.md
      - alert: LinuxHostCPUHigh
        expr: 100 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 90
        for: 15m
        labels: { severity: warning, team: platform }
        annotations:
          summary: CPU Linux acima de 90%
          runbook_url: docs/runbooks/operational-response.md
      - alert: LinuxHostFilesystemLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.10 and on(instance,device,mountpoint) node_filesystem_readonly == 0
        for: 15m
        labels: { severity: warning, team: platform }
        annotations:
          summary: Filesystem Linux abaixo de 10% livre
          runbook_url: docs/runbooks/operational-response.md
      - alert: LinuxHostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 15m
        labels: { severity: warning, team: platform }
        annotations:
          summary: Memória disponível abaixo de 10%
          runbook_url: docs/runbooks/operational-response.md
      - alert: LinuxHostClockSkew
        expr: abs(node_timex_offset_seconds) > 0.1
        for: 10m
        labels: { severity: warning, team: platform }
        annotations:
          summary: Clock skew Linux acima de 100 ms
          runbook_url: docs/runbooks/operational-response.md

  - name: sentinelops-vmware
    rules:
      - alert: VMwareInventoryUnavailable
        expr: absent(sentinelops_vmware_scrape_success) or sentinelops_vmware_scrape_success != 1
        for: 3m
        labels: { severity: critical, team: platform, integration: vmware }
        annotations:
          summary: Coleta de inventário VMware indisponível
          runbook_url: docs/integrations/vmware-monitoring.md
      - alert: VMwarePerformanceUnavailable
        expr: absent(sentinelops_vmware_performance_scrape_success) or sentinelops_vmware_performance_scrape_success != 1
        for: 5m
        labels: { severity: warning, team: platform, integration: vmware }
        annotations:
          summary: Coleta de rede e disco VMware indisponível
          runbook_url: docs/integrations/vmware-monitoring.md
      - alert: VMwareVirtualMachinePoweredOff
        expr: sentinelops_vmware_vm_power_state == 0
        for: 5m
        labels: { severity: warning, team: platform, integration: vmware }
        annotations:
          summary: Máquina virtual desligada
          runbook_url: docs/integrations/vmware-monitoring.md
      - alert: VMwareDatastoreLowSpace
        expr: sentinelops_vmware_datastore_free_bytes / sentinelops_vmware_datastore_capacity_bytes < 0.10
        for: 15m
        labels: { severity: warning, team: platform, integration: vmware }
        annotations:
          summary: Datastore VMware abaixo de 10% livre
          runbook_url: docs/integrations/vmware-monitoring.md
      - alert: VMwareVirtualMachineDiskLatencyHigh
        expr: max by (endpoint, vm_name, vm_uuid) (sentinelops_vmware_vm_disk_read_latency_milliseconds or sentinelops_vmware_vm_disk_write_latency_milliseconds) > 20
        for: 10m
        labels: { severity: warning, team: platform, integration: vmware }
        annotations:
          summary: Latência de disco de VM acima de 20 ms
          runbook_url: docs/integrations/vmware-monitoring.md

  - name: sentinelops-applications
    rules:
      - alert: ApplicationErrorRateHigh
        expr: sum by (service) (rate(demo_pipeline_requests_total{status=~"5.."}[5m])) / clamp_min(sum by (service) (rate(demo_pipeline_requests_total[5m])), 0.000001) > 0.05
        for: 10m
        labels: { severity: warning, team: platform }
        annotations:
          summary: Taxa de erro da aplicação acima de 5%
          runbook_url: docs/runbooks/operational-response.md
      - alert: ApplicationLatencyP95High
        expr: histogram_quantile(0.95, sum by (le,service) (rate(demo_pipeline_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning, team: platform }
        annotations:
          summary: Latência p95 da aplicação acima de 1 segundo
          runbook_url: docs/runbooks/operational-response.md
