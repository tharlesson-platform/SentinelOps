groups:
  - name: sentinelops-self-monitoring
    rules:
      - alert: SentinelAPIUnavailable
        expr: up{job="sentinel-api"} == 0
        for: 2m
        labels: { severity: critical, team: platform, service: sentinel-api }
        annotations:
          summary: SentinelOps API indisponível
          runbook_url: docs/runbooks/control-plane-unavailable.md
      - alert: SyntheticProbeFailing
        expr: probe_success{job="blackbox-production"} == 0
        for: 2m
        labels: { severity: warning, team: platform, service: tqipedia }
        annotations:
          summary: Probe sintético falhando
          runbook_url: docs/runbooks/synthetic-tests-failing.md
      - alert: TenantRequestQuotaExceeded
        expr: increase(sentinel_tenant_quota_rejections_total[5m]) > 0
        for: 0m
        labels: { severity: warning, team: platform, service: sentinel-api }
        annotations:
          summary: Quota de requisições de uma organização excedida
          runbook_url: docs/operations/tenant-quotas.md
      - record: service:http_requests:rate5m
        expr: sum by (job) (rate(http_server_request_duration_seconds_count{job=~"tqi-platform/.+"}[5m]))

  - name: sentinelops-linux-hosts
    rules:
      - alert: LinuxHostDown
        expr: up{job="linux-node"} == 0
        for: 5m
        labels: { severity: critical, team: platform }
        annotations:
          summary: Host Linux sem coleta há 5 minutos
          runbook_url: docs/runbooks/operational-response.md
      - alert: LinuxHostCPUHigh
        expr: 100 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 90
        for: 15m
        labels: { severity: warning, team: platform }
        annotations:
          summary: CPU Linux acima de 90%
          runbook_url: docs/runbooks/operational-response.md
      - alert: LinuxHostFilesystemLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.10 and on(instance,device,mountpoint) node_filesystem_readonly == 0
        for: 15m
        labels: { severity: warning, team: platform }
        annotations:
          summary: Filesystem Linux abaixo de 10% livre
          runbook_url: docs/runbooks/operational-response.md
      - alert: LinuxHostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 15m
        labels: { severity: warning, team: platform }
        annotations:
          summary: Memória disponível abaixo de 10%
          runbook_url: docs/runbooks/operational-response.md
      - alert: LinuxHostClockSkew
        expr: abs(node_timex_offset_seconds) > 0.1
        for: 10m
        labels: { severity: warning, team: platform }
        annotations:
          summary: Clock skew Linux acima de 100 ms
          runbook_url: docs/runbooks/operational-response.md

  - name: sentinelops-docker-containers
    rules:
      - alert: DockerContainerMetricsStale
        expr: time() - max by (instance) (container_last_seen{name!=""}) > 120
        for: 5m
        labels: { severity: warning, team: platform, integration: docker }
        annotations:
          summary: Métricas de contêiner desatualizadas há mais de 5 minutos
          runbook_url: docs/runbooks/docker-observability.md
      - alert: DockerContainerRestarted
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 0
        for: 2m
        labels: { severity: warning, team: platform, integration: docker }
        annotations:
          summary: Contêiner reiniciado nos últimos 15 minutos
          runbook_url: docs/runbooks/docker-observability.md

  - name: sentinelops-vmware
    rules:
      - alert: VMwareInventoryUnavailable
        expr: absent(sentinelops_vmware_scrape_success) or sentinelops_vmware_scrape_success != 1
        for: 3m
        labels: { severity: critical, team: platform, integration: vmware }
        annotations:
          summary: Coleta de inventário VMware indisponível
          runbook_url: docs/integrations/vmware-monitoring.md

      - alert: VMwarePerformanceUnavailable
        expr: absent(sentinelops_vmware_performance_scrape_success) or sentinelops_vmware_performance_scrape_success != 1
        for: 5m
        labels: { severity: warning, team: platform, integration: vmware }
        annotations:
          summary: Coleta de rede e disco VMware indisponível
          runbook_url: docs/integrations/vmware-monitoring.md
      - alert: VMwareVirtualMachinePoweredOff
        expr: sentinelops_vmware_vm_power_state == 0
        for: 5m
        labels: { severity: warning, team: platform, integration: vmware }
        annotations:
          summary: Máquina virtual desligada
          runbook_url: docs/integrations/vmware-monitoring.md
      - alert: VMwareDatastoreLowSpace
        expr: sentinelops_vmware_datastore_free_bytes / sentinelops_vmware_datastore_capacity_bytes < 0.10
        for: 15m
        labels: { severity: warning, team: platform, integration: vmware }
        annotations:
          summary: Datastore VMware abaixo de 10% livre
          runbook_url: docs/integrations/vmware-monitoring.md
      - alert: VMwareVirtualMachineDiskLatencyHigh
        expr: max by (endpoint, vm_name, vm_uuid) (sentinelops_vmware_vm_disk_read_latency_milliseconds or sentinelops_vmware_vm_disk_write_latency_milliseconds) > 20
        for: 10m
        labels: { severity: warning, team: platform, integration: vmware }
        annotations:
          summary: Latência de disco de VM acima de 20 ms
          runbook_url: docs/integrations/vmware-monitoring.md

  - name: sentinelops-postgresql
    rules:
      # Do not use absent(): the optional Compose profile is disabled until a
      # real monitored database and a TLS credential have been approved.
      - alert: PostgreSQLCollectorUnhealthy
        expr: sentinelops_postgres_scrape_success == 0 or (time() - sentinelops_postgres_last_success_unixtime) > 120
        for: 3m
        labels:
          severity: critical
          team: '{{ $labels.team }}'
          asset_id: '{{ $labels.asset_id }}'
          integration: postgresql
        annotations:
          summary: Coleta PostgreSQL indisponível ou desatualizada
          runbook_url: docs/operations/postgresql-collector.md
      - alert: PostgreSQLConnectionSaturation
        expr: sentinelops_postgres_connections / clamp_min(sentinelops_postgres_max_connections, 1) > 0.85
        for: 10m
        labels:
          severity: warning
          team: '{{ $labels.team }}'
          asset_id: '{{ $labels.asset_id }}'
          integration: postgresql
        annotations:
          summary: Conexões PostgreSQL acima de 85% do limite
          runbook_url: docs/operations/postgresql-collector.md
      - alert: PostgreSQLBlockedLocks
        expr: sentinelops_postgres_blocked_locks > 0
        for: 5m
        labels:
          severity: warning
          team: '{{ $labels.team }}'
          asset_id: '{{ $labels.asset_id }}'
          integration: postgresql
        annotations:
          summary: Locks PostgreSQL não concedidos persistentes
          runbook_url: docs/operations/postgresql-collector.md
      - alert: PostgreSQLDeadlocks
        expr: increase(sentinelops_postgres_deadlocks_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          team: '{{ $labels.team }}'
          asset_id: '{{ $labels.asset_id }}'
          integration: postgresql
        annotations:
          summary: Deadlock PostgreSQL detectado
          runbook_url: docs/operations/postgresql-collector.md

  - name: sentinelops-applications
    rules:
      - alert: ApplicationErrorRateHigh
        expr: sum by (job) (rate(http_server_request_duration_seconds_count{job=~"tqi-platform/.+",http_response_status_code=~"5.."}[5m])) / clamp_min(sum by (job) (rate(http_server_request_duration_seconds_count{job=~"tqi-platform/.+"}[5m])), 0.000001) > 0.05
        for: 10m
        labels: { severity: warning, team: platform }
        annotations:
          summary: Taxa de erro da aplicação acima de 5%
          runbook_url: docs/runbooks/operational-response.md
      - alert: ApplicationLatencyP95High
        expr: histogram_quantile(0.95, sum by (le,job) (rate(http_server_request_duration_seconds_bucket{job=~"tqi-platform/.+"}[5m]))) > 1
        for: 10m
        labels: { severity: warning, team: platform }
        annotations:
          summary: Latência p95 da aplicação acima de 1 segundo
          runbook_url: docs/runbooks/operational-response.md

  - name: sentinelops-local-log-queue
    rules:
      # Perfil habilitado neste host; ampliar a lista junto do rollout em outro host.
      - alert: LocalLogCollectorMissing
        expr: (count(node_uname_info{host_name="tqi-platform"}) > 0) and on() (absent_over_time(up{job="sentinelops-local-logs",host_name="tqi-platform"}[3m]) or (max_over_time(up{job="sentinelops-local-logs",host_name="tqi-platform"}[3m]) == 0))
        for: 1m
        labels: {severity: critical, team: platform, host_name: tqi-platform}
        annotations:
          summary: Collector de logs local ausente ou sem scrape válido há três minutos
          runbook_url: deploy/agents/linux/docker-read/README.md
      - alert: LocalLogQueuePressure
        expr: otelcol_exporter_queue_size{job="sentinelops-local-logs"} / otelcol_exporter_queue_capacity{job="sentinelops-local-logs"} > 0.8
        for: 2m
        labels: {severity: warning, team: platform}
        annotations:
          summary: Fila persistente de logs acima de 80%
          runbook_url: deploy/agents/linux/docker-read/README.md
      - alert: LocalLogEnqueueFailure
        expr: increase(otelcol_exporter_enqueue_failed_log_records_total{job="sentinelops-local-logs"}[5m]) > 0
        for: 0m
        labels: {severity: critical, team: platform}
        annotations:
          summary: Falha ao persistir registros na fila de logs
          runbook_url: deploy/agents/linux/docker-read/README.md
      - alert: LocalLogDeliveryFailure
        expr: increase(otelcol_exporter_send_failed_log_records_total{job="sentinelops-local-logs"}[5m]) > 0
        for: 0m
        labels: {severity: warning, team: platform}
        annotations:
          summary: Destino recusou registros de logs; verificar fila e retries
          runbook_url: deploy/agents/linux/docker-read/README.md
