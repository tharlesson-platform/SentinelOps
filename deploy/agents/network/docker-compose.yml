name: sentinelops-network-collector

x-security: &security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  collector-certs-init:
    image: public.ecr.aws/docker/library/alpine:3.23.5@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
    entrypoint: ["/bin/sh", "-ec"]
    command: ["install -m 0644 /source/ca.crt /source/client.crt /certs/ && install -m 0600 /source/client.key /certs/client.key && chown -R 473:473 /certs"]
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    volumes:
      - ./certs:/source:ro
      - collector-certs:/certs
    restart: "no"

  snmp-exporter:
    image: ${SENTINEL_SNMP_EXPORTER_IMAGE:-prom/snmp-exporter:v0.30.1@sha256:e5fd5e8b43ace6c088fe9bf0b37b7fff0e04380bee352be7ec41b853a4dd5859}
    command:
      - --config.file=/etc/snmp_exporter/snmp.yml
      - --config.file=/etc/sentinelops/snmp-auth.yml
      - --config.expand-environment-variables
    env_file: ["${SENTINEL_NETWORK_ENV_FILE:-.env}"]
    expose: ["9116"]
    volumes:
      - ./snmp-auth.yml:/etc/sentinelops/snmp-auth.yml:ro
    networks: [collector]
    <<: *security
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  alloy:
    image: ${SENTINEL_ALLOY_IMAGE:-sentinelops-alloy:1.18.1-patched.2}
    command:
      - run
      - /etc/alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    env_file: ["${SENTINEL_NETWORK_ENV_FILE:-.env}"]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./targets.generated.alloy:/etc/alloy/targets.generated.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - collector-certs:/etc/sentinelops/certs:ro
    ports:
      - "127.0.0.1:${SENTINEL_NETWORK_COLLECTOR_ADMIN_PORT:-12347}:12345"
    depends_on:
      collector-certs-init: { condition: service_completed_successfully }
      snmp-exporter: { condition: service_started }
    networks: [collector]
    <<: *security
    user: "473:473"
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  syslog:
    image: ${SENTINEL_ALLOY_IMAGE:-sentinelops-alloy:1.18.1-patched.2}
    profiles: [syslog]
    command:
      - run
      - /etc/alloy/config-syslog.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    env_file: ["${SENTINEL_NETWORK_ENV_FILE:-.env}"]
    volumes:
      - ./config-syslog.alloy:/etc/alloy/config-syslog.alloy:ro
      - syslog-data:/var/lib/alloy/data
      - collector-certs:/etc/sentinelops/certs:ro
    ports:
      - "${SENTINEL_SYSLOG_BIND_ADDRESS:-127.0.0.1}:${SENTINEL_SYSLOG_PORT:-1514}:1514/udp"
      - "${SENTINEL_SYSLOG_BIND_ADDRESS:-127.0.0.1}:${SENTINEL_SYSLOG_PORT:-1514}:1514/tcp"
      - "127.0.0.1:${SENTINEL_SYSLOG_ADMIN_PORT:-12348}:12345"
    depends_on:
      collector-certs-init: { condition: service_completed_successfully }
    networks: [collector]
    <<: *security
    user: "473:473"
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

networks:
  collector: {}

volumes:
  alloy-data: {}
  collector-certs: {}
  syslog-data: {}
