sentinelops-production-gate:
  stage: verify
  image: curlimages/curl:8.18.0
  environment: production
  when: manual
  allow_failure: false
  script:
    - apk add --no-cache jq=1.8.1-r0
    - >-
      RELEASE_ID=$(curl --fail-with-body --retry 3 --max-time 20 -sS -X POST "$SENTINEL_URL/api/v1/releases"
      -H "Authorization: Bearer $SENTINEL_TOKEN" -H "Idempotency-Key: $CI_PIPELINE_ID-$CI_JOB_ID"
      -H 'Content-Type: application/json'
      --data "{\"service\":\"$CI_PROJECT_NAME\",\"environment\":\"production\",\"version\":\"$CI_COMMIT_TAG\",\"commitSha\":\"$CI_COMMIT_SHA\",\"imageDigest\":\"$IMAGE_DIGEST\",\"deployedAt\":\"$(date -u +%FT%TZ)\",\"pipelineUrl\":\"$CI_PIPELINE_URL\"}" | jq -er .data.id)
    - >-
      VALIDATION_ID=$(curl --fail-with-body --max-time 20 -sS -X POST "$SENTINEL_URL/api/v1/releases/$RELEASE_ID/validate"
      -H "Authorization: Bearer $SENTINEL_TOKEN" -H 'Content-Type: application/json' --data '{"mode":"standard"}' | jq -er .data.id)
    - |
      for attempt in $(seq 1 90); do
        curl --fail-with-body --max-time 20 -sS "$SENTINEL_URL/api/v1/validations/$VALIDATION_ID" -H "Authorization: Bearer $SENTINEL_TOKEN" > sentinelops-validation.json
        [ "$(jq -r .data.status sentinelops-validation.json)" = COMPLETED ] && break
        sleep 10
      done
      case "$(jq -r .data.result sentinelops-validation.json)" in PASS|WARN) exit 0;; FAIL) exit 2;; INCONCLUSIVE) exit 4;; *) exit 3;; esac
  artifacts: { when: always, paths: [sentinelops-validation.json], expire_in: 30 days }

