name: release-images

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sentinelops-api
            context: .
            dockerfile: Dockerfile.app
            build_args: APP=api
          - image: sentinelops-worker
            context: .
            dockerfile: Dockerfile.app
            build_args: APP=worker
          - image: sentinelops-agent
            context: .
            dockerfile: Dockerfile.app
            build_args: APP=agent
          - image: sentinelops-demo-api
            context: .
            dockerfile: Dockerfile.demo
            build_args: ''
          - image: sentinelops-web
            context: apps/web
            dockerfile: apps/web/Dockerfile
            build_args: ''
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@v4.2.0
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign immutable digest with GitHub OIDC
        env:
          COSIGN_YES: 'true'
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign "$IMAGE@$DIGEST"
