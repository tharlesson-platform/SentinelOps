name: ci
on:
  pull_request: {}
  push: { branches: [main] }
permissions:
  contents: read
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7.0.0
        with: { go-version: 1.26.6, cache: true }
      - run: find apps internal demo -name '*.go' -print0 | xargs -0 gofmt -d | tee /tmp/gofmt.diff && test ! -s /tmp/gofmt.diff
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage-go.out ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - uses: actions/setup-node@v7.0.0
        with: { node-version: 26.7.0, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --ignore-scripts
        working-directory: apps/web
      - run: npm test -- --coverage=false
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm audit --omit=dev
        working-directory: apps/web
      - run: helm lint deploy/helm/sentinelops && helm template sentinelops deploy/helm/sentinelops --set global.oidcIssuerURL=https://id.example.com/realms/platform >/tmp/rendered.yaml
      - run: terraform fmt -check -recursive infra/terraform
      - uses: gitleaks/gitleaks-action@v2.3.9
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: fs, scan-ref: ., severity: CRITICAL,HIGH, exit-code: '1', ignore-unfixed: true }

  images:
    runs-on: ubuntu-24.04
    needs: test
    strategy: { matrix: { app: [api, worker, agent] } }
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile.app
          build-args: APP=${{ matrix.app }}
          platforms: linux/amd64
          load: true
          push: false
          tags: sentinelops-${{ matrix.app }}:${{ github.sha }}
          provenance: true
          sbom: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sentinelops-${{ matrix.app }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
