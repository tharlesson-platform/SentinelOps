version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday, time: '09:00', timezone: America/Sao_Paulo }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday, time: '09:30', timezone: America/Sao_Paulo }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: '10:00', timezone: America/Sao_Paulo }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday, time: '10:30', timezone: America/Sao_Paulo }
    open-pull-requests-limit: 5
